<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keranjang - Litscape</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <header class="navbar">
      <div class="container nav-inner">
        <a href="index.html" class="logo">
          <img src="image/Litscapeg.png" alt="Litscape Logo" class="logo-img" />
        </a>

        <div class="navbar-extra">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Cari..." />
            <i data-feather="search"></i>
          </div>
        </div>

        <nav class="menu">
          <a href="index.html">Beranda</a>
          <a href="index.html#tentang">Tentang</a>
          <a href="katalog.html">Katalog</a>
          <a href="bantuan.html">Bantuan</a>
          <a href="keranjang.html" class="btn-cart active"
            >Keranjang (<span id="cart-count">0</span>)</a
          >
        </nav>
      </div>
    </header>

    <main>
      <section id="keranjang" class="section section-alt">
        <div class="container narrow">
          <h2>Keranjang</h2>
          <div class="cart" id="cart"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Listcape. Semua hak dilindungi.</p>
    </footer>
    <script src="cart.js"></script>
    <script>
      feather.replace();
      document
        .querySelector("#search-input")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            window.find(this.value);
          }
        });
    </script>
  </body>
</html>
